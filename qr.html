<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Install EAP Assistant</title>
	<style>
		:root {
                            			--navy: #12253f;
			--blue: #4b86f7;
			--paper: #f6f9fd;
			--muted: #758398;
			--line: #e6ebf2;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #000000;
			color: var(--navy);
			font-family: Inter, "Segoe UI", sans-serif;
		}

		main {
			width: min(100%, 420px);
			padding: 32px 24px;
			border-radius: 20px;
			background: var(--paper);
			text-align: center;
			box-shadow: 0 16px 40px rgba(18, 37, 63, 0.2);
		}

		.eyebrow {
			margin: 0 0 8px;
			color: var(--blue);
			font-size: 11px;
			font-weight: 800;
			letter-spacing: 1.4px;
			text-transform: uppercase;
		}

		h1 { margin: 0; font-size: 28px; }
		p { color: var(--muted); font-size: 14px; line-height: 1.5; }

		.qr-frame {
			display: inline-grid;
			place-items: center;
			margin: 18px 0 12px;
			padding: 18px;
			background: #01070c;
			border: 1px solid var(--line);
			border-radius: 12px;
		}

		#qrCode img,
		#qrCode canvas { display: block; width: 240px; height: 240px; }

		.actions { display: grid; gap: 10px; margin-top: 16px; }

		.theme-link {
			display: inline-block;
			margin-top: 18px;
			padding: 8px 12px;
			border: 1px solid var(--line);
			border-radius: 8px;
			color: var(--navy);
			font-size: 13px;
			font-weight: 700;
			text-decoration: none;
		}

		.actions a {
			display: block;
			padding: 12px 16px;
			border-radius: 10px;
			font-size: 13px;
			font-weight: 800;
			text-decoration: none;
		}

		#downloadQr { background: var(--blue); color: #fff; }
		.back { color: var(--blue); }
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">EAP Assistant</p>
		<h1>Install EAP Assistant</h1>
		<p>Scan the code to open EAP Assistant. On Android, choose Install app or Add to Home screen. On iPhone or iPad, open the link in Safari, tap Share, then Add to Home Screen.</p>
		<a class="theme-link" href="dark.html">Dark mode</a>
		<div class="qr-frame">
			  <div id="qrCode" aria-label="QR code to open EAP Assistant"></div>
		</div>
		<div class="actions">
			<a id="downloadQr" href="#" download="eap-assistant-qr.png">Download QR code</a>
			<a class="back" href="appli.html">Back to app</a>
		</div>
	</main>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
	<script>
		const appUrl = new URL("/appli.html", window.location.origin).href;
		const qrCode = document.getElementById("qrCode");
		const downloadQr = document.getElementById("downloadQr");

		new QRCode(qrCode, {
			text: appUrl,
			width: 240,
			height: 240,
			colorDark: "#12253f",
			colorLight: "#ffffff",
			correctLevel: QRCode.CorrectLevel.H
		});

		const generatedQr = qrCode.querySelector("canvas, img");
		downloadQr.href = generatedQr.tagName === "CANVAS"
			? generatedQr.toDataURL("image/png")
			: generatedQr.src;
	</script>
</body>
</html>
