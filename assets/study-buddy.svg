<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <style>
    .sunflower { transform-box: view-box; transform-origin: 80px 148px; animation: bob 3s ease-in-out infinite; }
    .bloom { transform-box: view-box; transform-origin: 80px 67px; animation: sway 4.2s ease-in-out infinite; }
    .leaf { transform-box: view-box; transform-origin: 80px 119px; animation: leaf-sway 3.6s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s ease-in-out infinite; }
    .sparkle { transform-box: view-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .sparkle:nth-of-type(2) { animation-delay: 1.1s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes leaf-sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.12); } }
    @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(18deg); } }
    @media (prefers-reduced-motion: reduce) { .sunflower, .bloom, .leaf, .eye, .sparkle { animation: none; } }
  </style>
  <ellipse cx="80" cy="150" rx="28" ry="4" fill="#173D38" opacity=".12"/>
  <path d="M80 89c1 19-2 38 0 57" stroke="#347D59" stroke-width="8" stroke-linecap="round"/>
  <g class="leaf">
    <path d="M78 119c-18-18-34-13-35-2 8 14 22 18 36 8m4 3c13-16 28-15 31-5-5 12-17 18-31 14" fill="#62A96B" stroke="#245B49" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="m47 117 29 8m42-8-31 13" stroke="#347D59" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g class="sunflower">
    <g class="bloom">
      <g fill="#F5BD45" stroke="#A96524" stroke-width="2.5">
        <ellipse cx="80" cy="29" rx="10" ry="22"/>
        <ellipse cx="80" cy="29" rx="10" ry="22" transform="rotate(30 80 67)"/>
        <ellipse cx="80" cy="29" rx="10" ry="22" transform="rotate(60 80 67)"/>
        <ellipse cx="80" cy="29" rx="10" ry="22" transform="rotate(90 80 67)"/>
        <ellipse cx="80" cy="29" rx="10" ry="22" transform="rotate(120 80 67)"/>
        <ellipse cx="80" cy="29" rx="10" ry="22" transform="rotate(150 80 67)"/>
      </g>
      <circle cx="80" cy="67" r="28" fill="#80502F" stroke="#513822" stroke-width="3"/>
      <circle cx="80" cy="67" r="23" fill="#98623A"/>
      <g fill="#E6B763" opacity=".9">
        <circle cx="68" cy="55" r="1.7"/><circle cx="80" cy="52" r="1.7"/><circle cx="92" cy="57" r="1.7"/>
        <circle cx="62" cy="68" r="1.7"/><circle cx="98" cy="69" r="1.7"/><circle cx="69" cy="80" r="1.7"/>
        <circle cx="90" cy="81" r="1.7"/><circle cx="80" cy="84" r="1.7"/>
      </g>
      <ellipse class="eye" cx="72" cy="65" rx="2.4" ry="3.5" fill="#2D2B25"/>
      <ellipse class="eye" cx="88" cy="65" rx="2.4" ry="3.5" fill="#2D2B25"/>
      <path d="M73 75c4 5 10 5 14 0" stroke="#3D2E25" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="64" cy="73" r="3" fill="#E88764" opacity=".8"/>
      <circle cx="96" cy="73" r="3" fill="#E88764" opacity=".8"/>
    </g>
  </g>
  <path class="sparkle" d="m31 42 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7Z" fill="#70B9A0"/>
  <path class="sparkle" d="m128 30 2.4 5.6L136 38l-5.6 2.4L128 46l-2.4-5.6L120 38l5.6-2.4L128 30Z" fill="#F5BD45"/>
</svg>